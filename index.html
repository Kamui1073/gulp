<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <script src="lib/vue.min.js"></script>
    <script src="lib/moment.min.js"></script>
    <script src="lib/antd.min.js"></script>
    <link rel="stylesheet" href="lib/antd.min.css">
    <link id="dark" rel="stylesheet" href="lib/antd.dark.css">
    <link rel="stylesheet" href="lib/style.css">
    <!-- 图标 -->
    <link rel="stylesheet" href="lib/font-awesome/css/font-awesome.min.css">
</head>
<body>
    <div class="content" id = "app">
        <!--主题切换-->
        <span class="icon" :title="data.isDark ? '开灯' : '关灯'" @click="setTheme">
            <svg v-if="data.isDark"  t="1725248368445" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="6776"><path d="M450.6 64.9h125.6v125.6H450.6zM150.065 239.09l88.81-88.81 88.812 88.81-88.811 88.812zM60.9 449.2h125.6v125.6H60.9zM146.305 786.482l88.811-88.811 88.811 88.81-88.811 88.812zM445.2 838.9h125.6v125.6H445.2zM693.696 790.241l88.81-88.81 88.812 88.81-88.811 88.811zM834.9 454.6h125.6v125.6H834.9zM697.385 242.921l88.81-88.81 88.812 88.81-88.811 88.811zM513 261c-139.9 0-253.2 113.4-253.2 253.2S373.1 767.5 513 767.5s253.2-113.4 253.2-253.2S652.9 261 513 261z" p-id="6777"></path></svg>
            <svg v-else t="1725502425970" style="fill: #333" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="4365"><path d="M618.496 111.616c9.216 34.304 14.336 70.656 14.336 108.032 0 228.352-184.832 413.184-413.184 413.184-37.376 0-73.728-5.12-108.544-14.336 47.616 175.616 207.872 305.152 398.848 305.152 228.352 0 413.184-184.832 413.184-413.184 0-190.976-129.024-351.232-304.64-398.848z" p-id="4366"></path></svg>
        </span>
        <!--查询条件-->
        <a-card :bordered="false" hoverable  :body-style="{marginBottom:'15px'}">
            <a-row>
                <a-col class="btnWrap" :sm="24" :md="4">
                    <a-statistic v-if="data.isShow" :title="'共有' + data.tags  + '页面'" :value="data.number" :value-style="{ color: '#ccc' }" style="margin-right: 50px">
                        <template #prefix>
                            <a-avatar slot="avatar" :style="{backgroundColor:data.titleIconColor}"><i :class="'fa fa-' + data.titleIcon"></i></a-avatar>
                        </template>
                        <template #suffix>
                          <span style="font-weight: normal;font-size: 14px">个</span>
                        </template>
                    </a-statistic>
                    <a-statistic v-if="!data.isShow" :title="'共有' + data.searchWord  + '页面'" :value="data.number" :value-style="{ color: '#666' }" style="margin-right: 50px">
                        <template #prefix>
                            <a-avatar slot="avatar" :style="{backgroundColor:data.titleIconColor}"><i :class="'fa fa-' + data.titleIcon"></i></a-avatar>
                        </template>
                        <template #suffix>
                            <span style="font-weight: normal;font-size: 14px">个</span>
                        </template>
                    </a-statistic>
                </a-col>
                <a-col :sm="24" :md="8" style="padding-top: 15px;">
                    <a-input-search placeholder="请输入搜索文本" v-model:value="data.searchValue" enter-button @search="onSearch" />
                </a-col>
                <a-col :sm="24" :md="6" class="clearfix">
                    <a-button  @click="resetSearch" style="margin-top: 15px;float: left;margin-left: 10px;"><i class="fa fa-refresh"></i>重置</a-button>
                    <a-button type="danger" @click="data.visible = true" style="margin-top: 15px; float: right;"><i class="fa fa-question-circle"></i>使用方法</a-button>
                </a-col>
                <a-col :sm="24" :md="6" style="text-align: right;">
                    <a-radio-group style="margin-top: 15px;" :value="data.dataTag" @change="handleSizeChange">
                        <a-radio-button v-for="(item,index) in data.tagData" :key="index" :value="item.name">
                            {{ item.name }}
                        </a-radio-button>
                    </a-radio-group>
                </a-col>
            </a-row>
        </a-card>
        <!--列表-->
        <a-card :bordered="false" hoverable style="min-height: 326px;">
            <template #title>
                <span class="titIcon fl"><i class="fa fa-book"></i></span>
                <span content="fl" class="setTitle">{{ data.htmlTitle }}</span>
            </template>
            <a-table :data-source="data.dataSource" :columns="data.columns" :pagination="data.pagination" :locale="{emptyText: '暂无数据'}">
                <template #tag="{ text }">
                      <span>
                          <a-tag :color="text === '电脑端' ? 'volcano' : 'green'">{{ text }}</a-tag>
                      </span>
                </template>
                <template #name="{ text }">
                    <a class="tableLink" :href ="data.link + text + '.html'" target="_blank" v-html="highLight(String(text))"></a>
                </template>
            </a-table>
        </a-card>
        <!-- 说明弹窗 -->
        <a-modal v-model:visible="data.visible" class="examples" width="600px" title="使用方法" :footer="null"  @ok="hideModal">
            <div v-html="data.htmlData"></div>
        </a-modal>
    </div>
    <!--背景动画-->
    <canvas class="canvasBg" id="canvas"></canvas>
    <script src="lib/stars.js"></script>
    <!--数据文件-->
    <script src="lib/data.js"></script>
    <!--js文件-->
    <script src="lib/main.js"></script>
</body>
</html>
